# Envy Personal Assistant Configuration
# MIT License - Generated by Cursor

system:
  name: "Envy"
  version: "1.0.0"
  profile: "balanced"  # Options: low, balanced, power
  
# Resource Constraints
resources:
  max_cpu_percent: 50  # Maximum CPU usage per service
  max_memory_mb: 4096  # Maximum memory per service
  gpu_enabled: true
  gpu_memory_fraction: 0.7  # Use up to 70% of VRAM

# Wake Word Detection
wake:
  enabled: true
  keyword: "envy"
  model_path: "models/vosk-model-small-en-us-0.15"
  sensitivity: 0.5  # 0.0 to 1.0
  sample_rate: 16000
  energy_threshold: 300
  
# Speech-to-Text
stt:
  engine: "whisper"  # Options: whisper, vosk
  model_size: "base"  # tiny, base, small, medium
  model_path: "models/whisper-base"
  language: "en"
  streaming: true
  device: "auto"  # auto, cpu, cuda
  compute_type: "int8"  # fp16, int8, fp32
  
# Text-to-Speech
tts:
  engine: "pyttsx3"  # Options: pyttsx3, coqui
  rate: 175  # Words per minute
  volume: 0.9  # 0.0 to 1.0
  voice: "default"  # System-dependent
  streaming: false
  output_path: "artifacts/tts-output.wav"

# LLM Configuration
llm:
  primary: "local"  # Options: local, remote
  
  local:
    enabled: true
    model_path: "models/llama-2-7b-chat.Q4_0.gguf"
    context_size: 2048
    max_tokens: 256
    temperature: 0.7
    threads: 4
    gpu_layers: 20  # Number of layers to offload to GPU
    
  remote:
    enabled: false  # Optional fallback
    provider: "huggingface"  # Free inference API
    model: "mistralai/Mistral-7B-Instruct-v0.1"
    api_key: ""  # Optional, may work without for free tier
    max_retries: 3
    timeout: 30

# Router Configuration
router:
  intent_confidence_threshold: 0.6
  llm_fallback: true
  max_processing_time: 30  # seconds
  
# Skill System
skills:
  enabled: ["CodeSkill", "ResearchSkill", "SysControlSkill", "ReminderSkill"]
  timeout: 60  # seconds per skill execution
  sandboxed: true
  
  # Skill-specific configs
  code:
    workspace_path: "/workspace"
    allowed_extensions: [".py", ".js", ".txt", ".md", ".json", ".yaml"]
    max_file_size_kb: 1024
    
  research:
    max_results: 5
    output_path: "artifacts/research"
    use_local_search: true
    
  syscontrol:
    enabled: false  # DISABLED by default for safety
    require_confirmation: true
    whitelist: ["ls", "pwd", "date", "uptime", "df -h"]
    blacklist: ["rm", "sudo", "kill", "shutdown"]
    
  reminder:
    storage_path: "artifacts/reminders.json"
    check_interval: 60  # seconds

# Security
security:
  require_voice_confirmation: true
  require_dashboard_confirmation: true
  destructive_actions: ["delete", "remove", "shutdown", "reboot", "kill"]
  sandbox_commands: true
  max_command_length: 500

# Web Dashboard
web:
  enabled: true
  host: "127.0.0.1"
  port: 8080
  debug: false
  cors_enabled: false

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file: "artifacts/logs/envy.log"
  max_size_mb: 100
  backup_count: 5
  console: true

# Persona Configuration
persona:
  style: "neutral"  # neutral, friendly, sardonic
  conciseness: "medium"  # brief, medium, verbose
  custom_responses:
    greeting: "Envy here. What do you need?"
    confirmation: "Confirmed. Executing."
    error: "I encountered an issue."
    unknown: "I'm not sure how to help with that."
