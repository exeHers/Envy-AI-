[project]
name = "envy"
version = "0.1.0"
description = "Envy personal assistant"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Envy Team"}]
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sounddevice>=0.4.6",
    "vosk>=0.3.45",
    "pyaudio>=0.2.14",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pyttsx3>=2.90",
    "psutil>=5.9.8",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "jinja2>=3.1.3",
    "typer>=0.12.0",
    "watchfiles>=0.21.0",
    "websockets>=12.0",
    "llama_cpp_python>=0.2.73",
    "python-multipart>=0.0.9",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.26.0",
    "ruff>=0.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
