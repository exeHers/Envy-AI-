[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-assistant"
version = "0.1.0"
description = "Envy – a Jarvis-style personal assistant with wake word, STT, skills, and dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Cursor Build Agent", email = "devnull@example.com" }
]
keywords = ["voice assistant", "wake word", "fastapi", "vosk", "llm", "automation"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.29,<0.31",
    "vosk>=0.3.45",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pydantic>=2.7",
    "aiohttp>=3.9",
    "requests>=2.32",
    "pyttsx3>=2.90",
    "psutil>=5.9",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "orjson>=3.9",
    "uvloop>=0.19; platform_system != 'Windows'",
    "loguru>=0.7",
    "rich>=13.7",
    "tenacity>=8.3",
    "pydub>=0.25",
    "soundfile>=0.12",
    "scipy>=1.11",
    "websockets>=12.0",
    "python-dotenv>=1.0",
    "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "pytest-timeout>=2.1",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
]

[project.scripts]
envy-process-manager = "envy.scripts.process_manager:main"

[project.urls]
Homepage = "https://example.com/envy"
Repository = "https://example.com/envy/repo"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
