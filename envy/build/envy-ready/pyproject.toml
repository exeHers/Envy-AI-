[build-system]
requires = ["setuptools>=67.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envy-assistant"
version = "0.1.0"
description = "Envy: local-first Jarvis-style personal assistant with wake word, STT/TTS, modular skills, and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
  {name = "Cursor Envy Builders", email = "envy@example.com"}
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=1.10.12",
  "pyyaml>=6.0",
  "numpy>=1.26.0",
  "sounddevice>=0.4.6",
  "vosk>=0.3.45",
  "pyttsx3>=2.90",
  "psutil>=5.9.0",
  "requests>=2.31.0",
  "jinja2>=3.1.3",
  "python-multipart>=0.0.9",
  "aiofiles>=23.2.1",
  "sse-starlette>=1.8.2",
  "httpx>=0.27.0",
  "typer>=0.9.0",
  "rich>=13.7.0"
]

[project.optional-dependencies]
llm = [
  "llama-cpp-python>=0.2.90",
  "transformers>=4.37.0",
  "accelerate>=0.26.0",
  "sentencepiece>=0.1.99"
]
dev = [
  "pytest>=7.4.4",
  "pytest-asyncio>=0.23.5",
  "pytest-mock>=3.11.1"
]

[tool.setuptools]
package-dir = {"" = "envy"}

[tool.setuptools.package-data]
"envy" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

