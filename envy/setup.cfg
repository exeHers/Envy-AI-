[metadata]
name = envy-assistant
version = 0.1.0
description = Envy — Local Jarvis-style personal assistant
author = Cursor Agent
license = MIT

[options]
packages = find:
include_package_data = True
python_requires = >=3.10

[options.entry_points]
console_scripts =
    envy = envy.main:main

[flake8]
max-line-length = 100
extend-ignore = E203, W503
